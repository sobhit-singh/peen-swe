<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="8" />

  <!-- Technical Circuit Grid Lines -->
  <path d="M64 160h384M64 352h384M160 64v384M352 64v384" stroke="rgba(255,255,255,0.03)" stroke-width="2" />

  <!-- Ball-Peen Hammer (Forging Motif) -->
  <!-- Handle -->
  <path d="M168 376 L312 232" stroke="#E2E8F0" stroke-width="20" stroke-linecap="round" />
  <path d="M144 400 L188 356" stroke="url(#amberGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Hammer Head -->
  <!-- Flat Face (Striking side) -->
  <path d="M280 180 L350 110 L380 140 L310 210 Z" fill="url(#steelGrad)" stroke="#0B0F19" stroke-width="4" />
  <rect x="340" y="96" width="36" height="24" rx="4" transform="rotate(45 340 96)" fill="url(#amberGrad)" />

  <!-- Peen (Rounded Ball side) -->
  <circle cx="270" cy="220" r="18" fill="url(#steelGrad)" />

  <!-- Terminal Prompt Symbol ">_" overlaid with spark -->
  <g transform="translate(190, 270)">
    <!-- Terminal Command Angle -->
    <path d="M40 40 L90 80 L40 120" fill="none" stroke="url(#amberGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Cursor Block -->
    <rect x="110" y="100" width="40" height="18" rx="3" fill="#38BDF8" filter="url(#glow)" />
  </g>

  <!-- Kinetic Forge Sparks -->
  <circle cx="395" cy="105" r="7" fill="#FBBF24" filter="url(#glow)" />
  <circle cx="430" cy="90" r="4" fill="#F59E0B" />
  <circle cx="380" cy="65" r="5" fill="#38BDF8" />
  <path d="M410 120 L440 130" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
</svg>
